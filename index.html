<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaithra Maps | Real-Time Startup Ecosystem</title>
    
    <!-- Fonts: Inter for that clean, modern SaaS look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* =========================================================
           CSS VARIABLES (White, Blue, Clean Grays)
           ========================================================= */
        :root {
            --bg-base: #ffffff;
            --bg-surface: #f8fafc;
            --bg-surface-hover: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-light: #e2e8f0;
            --border-focus: #94a3b8;
            
            --blue-primary: #2563eb;
            --blue-hover: #1d4ed8;
            --blue-light: #eff6ff;
            --blue-text: #1e40af;
            
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-pill: 9999px;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-float: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            
            --transition-smooth: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================================
           RESET & TYPOGRAPHY
           ========================================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-surface);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 { letter-spacing: -0.02em; font-weight: 700; }
        
        /* =========================================================
           LAYOUT & NAVIGATION (Jakob's Law)
           ========================================================= */
        nav {
            background-color: var(--bg-base);
            border-bottom: 1px solid var(--border-light);
            padding: 0 2rem;
            height: 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            flex-shrink: 0;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 800;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .brand .dot {
            width: 8px;
            height: 8px;
            background-color: var(--blue-primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        nav ul { display: flex; list-style: none; gap: 2rem; align-items: center; }
        nav ul li a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
        }
        nav ul li a:hover, nav ul li a.active-link { color: var(--blue-primary); }

        #app-container { flex: 1; position: relative; overflow: hidden; }

        .view {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            overflow-y: auto;
            background: var(--bg-surface);
        }
        .view.active { opacity: 1; visibility: visible; }

        /* =========================================================
           UI COMPONENTS (Fitts's Law & Common Region)
           ========================================================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: none;
            text-decoration: none;
            /* Fitts's law: min 44px height for tap targets */
            min-height: 44px; 
        }

        .btn-primary {
            background-color: var(--blue-primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover {
            background-color: var(--blue-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-outline {
            background-color: var(--bg-base);
            color: var(--blue-primary);
            border: 1px solid var(--border-light);
        }
        .btn-outline:hover {
            border-color: var(--blue-primary);
            background-color: var(--blue-light);
        }

        .card {
            background: var(--bg-base);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
        }
        .card:hover { border-color: var(--border-focus); box-shadow: var(--shadow-md); }

        .badge-live {
            background-color: var(--blue-light);
            color: var(--blue-text);
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* =========================================================
           MAP VIEW (Split Screen Design)
           ========================================================= */
        #view-map.active { display: flex; overflow: hidden; padding: 0; }
        
        .map-sidebar {
            width: 400px;
            background: var(--bg-base);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 4px 0 15px rgba(0,0,0,0.03);
        }

        .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border-light); }
        .sidebar-header h2 { font-size: 1.25rem; margin-bottom: 12px; }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            background: var(--bg-surface);
            font-size: 0.95rem;
            transition: var(--transition-smooth);
            font-family: inherit;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--blue-primary);
            background: var(--bg-base);
            box-shadow: 0 0 0 3px var(--blue-light);
        }

        .startup-list { flex: 1; overflow-y: auto; padding: 12px; }
        
        .startup-list-item {
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition-smooth);
        }
        .startup-list-item:hover { background: var(--bg-surface); border-color: var(--border-light); }
        .startup-list-item h4 { font-size: 1.05rem; margin-bottom: 4px; }
        .startup-list-item p { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; }

        #map-container { flex: 1; background: #e5e5e5; z-index: 1; }

        /* =========================================================
           LEADERBOARD / OUTBID VIEW
           ========================================================= */
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        
        .leaderboard-header { text-align: center; margin-bottom: 40px; }
        .leaderboard-header h1 { font-size: 2.5rem; margin-bottom: 12px; }
        .leaderboard-header p { color: var(--text-secondary); font-size: 1.1rem; }

        .hero-bid-card {
            background: linear-gradient(180deg, var(--blue-light) 0%, var(--bg-base) 100%);
            border: 2px solid var(--blue-primary);
            text-align: center;
            padding: 40px 24px;
            margin-bottom: 32px;
        }
        
        .bid-input-group {
            display: flex;
            gap: 12px;
            max-width: 400px;
            margin: 24px auto 0;
        }
        .bid-input-group input { flex: 1; font-size: 1.1rem; font-weight: 600; }

        .leaderboard-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: var(--bg-base);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            transition: var(--transition-smooth);
        }
        .leaderboard-row:hover { transform: scale(1.01); box-shadow: var(--shadow-md); }
        
        .rank-info { display: flex; align-items: center; gap: 20px; }
        .rank-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--border-focus);
            width: 30px;
        }
        .row-1 .rank-number { color: var(--blue-primary); }
        
        /* Real-time flash animation */
        @keyframes flashUpdate {
            0% { background-color: var(--blue-primary); color: white; transform: scale(1.02); }
            100% { background-color: var(--bg-base); color: inherit; transform: scale(1); }
        }
        .flash-row { animation: flashUpdate 1s ease-out; }

        /* =========================================================
           TOAST NOTIFICATIONS (Real-time feel)
           ========================================================= */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 9999;
        }

        .toast {
            background: var(--text-primary);
            color: white;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 350px;
        }
        
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(10px); }
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION -->
    <nav>
        <a href="#/map" class="brand"><div class="dot"></div> Vaithra Maps</a>
        <ul>
            <li><a href="#/map" class="nav-link">Ecosystem Map</a></li>
            <li><a href="#/outbid" class="nav-link">Live Outbid</a></li>
            <li><a href="#/dashboard" class="btn btn-primary" style="color: white; padding: 8px 16px;">Add Startup</a></li>
        </ul>
    </nav>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container">
        
        <!-- MAP VIEW -->
        <div id="view-map" class="view active">
            <div class="map-sidebar">
                <div class="sidebar-header">
                    <h2>Discover Startups</h2>
                    <input type="text" id="search-box" class="search-input" placeholder="Search by name, city, or industry..." onkeyup="filterMap()">
                </div>
                <div class="startup-list" id="sidebar-list">
                    <!-- Populated by JS -->
                </div>
            </div>
            <div id="map-container"></div>
        </div>

        <!-- LEADERBOARD / OUTBID VIEW -->
        <div id="view-outbid" class="view">
            <div class="container">
                <div class="leaderboard-header">
                    <div class="badge-live" style="margin-bottom: 16px;">
                        <span style="display:inline-block; width:6px; height:6px; background:var(--blue-primary); border-radius:50%; animation:pulse 1s infinite;"></span>
                        Live Bidding
                    </div>
                    <h1>Sponsored Visibility</h1>
                    <p>Compete for the #1 spot on the map and directory. (Position does not imply organic ranking).</p>
                </div>

                <!-- Top Bidder Hero Card -->
                <div class="card hero-bid-card" id="top-bidder-card">
                    <!-- Populated by JS -->
                </div>

                <!-- Rankings List -->
                <div id="outbid-list">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container"></div>

    <script>
        /**
         * 1. APP DATA (Mocking Vaithra Ecosystem based on context)
         */
        const DB = {
            startups: [
                { id: 's1', name: 'Glowvai', tagline: 'AI-driven diagnostic facial skin analysis and quick-commerce.', city: 'Vijayawada', industry: 'HealthTech', lat: 16.5062, lng: 80.6480, bid: 4500 },
                { id: 's2', name: 'Vyapaarnet', tagline: 'Strategic digital ecosystem and holding infrastructure.', city: 'Vijayawada', industry: 'SaaS', lat: 16.5122, lng: 80.6300, bid: 3200 },
                { id: 's3', name: 'Vaithra', tagline: 'Founder infrastructure layer and credibility network for AP/TS.', city: 'Tirupati', industry: 'Community', lat: 13.6288, lng: 79.4192, bid: 2100 },
                { id: 's4', name: 'Vishvarupa Creations', tagline: 'Premium media and production partner.', city: 'Hyderabad', industry: 'Media', lat: 17.3850, lng: 78.4867, bid: 1500 },
                { id: 's5', name: 'O-Max Media', tagline: 'Social media marketing & founder branding agency.', city: 'Vijayawada', industry: 'Agency', lat: 16.4950, lng: 80.6550, bid: 500 }
            ],
            config: { minIncrement: 100 }
        };

        // Current User (Mock)
        const MY_STARTUP_ID = 's5'; // O-Max Media

        let map = null;
        let mapMarkers = [];

        /**
         * 2. ROUTING LOGIC
         */
        function handleRoute() {
            const hash = window.location.hash || '#/map';
            
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active-link'));

            if (hash === '#/map') {
                document.getElementById('view-map').classList.add('active');
                document.querySelector('a[href="#/map"]').classList.add('active-link');
                initMap();
            } else if (hash === '#/outbid') {
                document.getElementById('view-outbid').classList.add('active');
                document.querySelector('a[href="#/outbid"]').classList.add('active-link');
                renderLeaderboard();
            }
        }
        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('load', handleRoute);

        /**
         * 3. MAP & SIDEBAR LOGIC (Clean aesthetic)
         */
        function initMap() {
            if (!map) {
                map = L.map('map-container', { zoomControl: false }).setView([16.5062, 80.6480], 7);
                L.control.zoom({ position: 'bottomright' }).addTo(map);

                // Using CartoDB Positron for a very clean, light, white/gray map background
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
                }).addTo(map);
            }
            renderMapData(DB.startups);
        }

        const customIcon = L.divIcon({
            className: 'custom-pin',
            html: `<div style="background: var(--blue-primary); width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: var(--shadow-md);"></div>`,
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        function renderMapData(data) {
            // Clear markers
            mapMarkers.forEach(m => map.removeLayer(m));
            mapMarkers = [];
            
            const sidebar = document.getElementById('sidebar-list');
            sidebar.innerHTML = '';

            // Sort by bid for the sidebar
            const sorted = [...data].sort((a, b) => b.bid - a.bid);

            sorted.forEach((s, index) => {
                // Map Marker
                const marker = L.marker([s.lat, s.lng], { icon: customIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="font-family: 'Inter'; padding: 4px;">
                        <strong style="font-size: 1.1rem; color: var(--text-primary);">${s.name}</strong><br>
                        <span style="color: var(--text-secondary); font-size: 0.85rem;">${s.industry} • ${s.city}</span>
                    </div>
                `);
                mapMarkers.push(marker);

                // Sidebar Item
                sidebar.innerHTML += `
                    <div class="startup-list-item" onclick="flyToMap(${s.lat}, ${s.lng})">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                            <h4>${s.name}</h4>
                            ${s.bid > 0 ? `<span class="badge-live" style="font-size:0.65rem; background:var(--bg-base); border:1px solid var(--border-light);">#${index+1}</span>` : ''}
                        </div>
                        <p>${s.tagline}</p>
                        <p style="margin-top: 8px; font-size: 0.8rem; font-weight: 600; color: var(--blue-primary);">${s.industry}</p>
                    </div>
                `;
            });
        }

        function filterMap() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const filtered = DB.startups.filter(s => 
                s.name.toLowerCase().includes(query) || 
                s.city.toLowerCase().includes(query) || 
                s.industry.toLowerCase().includes(query)
            );
            renderMapData(filtered);
        }

        function flyToMap(lat, lng) {
            map.flyTo([lat, lng], 13, { duration: 1.5, easeLinearity: 0.25 });
        }

        /**
         * 4. LIVE OUTBID / LEADERBOARD LOGIC
         */
        function renderLeaderboard(flashedId = null) {
            const ranked = [...DB.startups].sort((a, b) => b.bid - a.bid);
            const top = ranked[0];
            const myStartup = DB.startups.find(s => s.id === MY_STARTUP_ID);
            
            const minNextBid = top.bid + DB.config.minIncrement;

            // Render Hero (Top Spot)
            document.getElementById('top-bidder-card').innerHTML = `
                <div class="badge-live" style="background: white; margin-bottom: 16px;">👑 Current Leader</div>
                <h2 style="font-size: 2rem; margin-bottom: 8px;">${top.name}</h2>
                <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 24px;">Highest Bid: <strong style="color: var(--text-primary);">₹${top.bid.toLocaleString()}</strong></p>
                
                <div class="card" style="background: white; text-align: left; padding: 20px;">
                    <h4 style="margin-bottom: 12px; font-size: 1rem;">Outbid to claim #1 for ${myStartup.name}</h4>
                    <div class="bid-input-group" style="margin: 0; max-width: 100%;">
                        <input type="number" id="bid-amount" class="search-input" placeholder="Min. ₹${minNextBid.toLocaleString()}" min="${minNextBid}" step="100">
                        <button class="btn btn-primary" onclick="submitBid()">Place Bid</button>
                    </div>
                </div>
            `;

            // Render List
            const listHtml = ranked.map((s, index) => `
                <div class="leaderboard-row row-${index+1} ${s.id === flashedId ? 'flash-row' : ''}" id="row-${s.id}">
                    <div class="rank-info">
                        <div class="rank-number">#${index + 1}</div>
                        <div>
                            <h3 style="font-size: 1.1rem; margin-bottom: 4px;">${s.name} ${s.id === MY_STARTUP_ID ? '<span style="color: var(--text-secondary); font-weight: normal; font-size: 0.9rem;">(You)</span>' : ''}</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">${s.city} • ${s.industry}</p>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">₹${s.bid.toLocaleString()}</div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('outbid-list').innerHTML = listHtml;
        }

        function submitBid() {
            const ranked = [...DB.startups].sort((a, b) => b.bid - a.bid);
            const minRequired = ranked[0].bid + DB.config.minIncrement;
            const inputVal = parseInt(document.getElementById('bid-amount').value);

            if (isNaN(inputVal) || inputVal < minRequired) {
                showToast(`Bid must be at least ₹${minRequired.toLocaleString()}`, "error");
                return;
            }

            // Update data
            const myStartup = DB.startups.find(s => s.id === MY_STARTUP_ID);
            myStartup.bid = inputVal;
            
            showToast(`Success! ${myStartup.name} is now #1`, "success");
            renderLeaderboard(MY_STARTUP_ID); // Pass ID to trigger flash animation
            
            // Re-render map sidebar if in background
            if(map) renderMapData(DB.startups);
        }

        /**
         * 5. TOAST & REAL-TIME SIMULATION
         */
        function showToast(message, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            let icon = '🔔';
            if(type === 'success') icon = '✅';
            if(type === 'error') icon = '⚠️';
            if(type === 'live') icon = '🔥';

            toast.innerHTML = `<span style="font-size: 1.2rem;">${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Simulate random ecosystem activity to make it feel alive
        setInterval(() => {
            // 30% chance every 10 seconds to simulate a live bid
            if(Math.random() > 0.7 && window.location.hash === '#/outbid') {
                const competitors = DB.startups.filter(s => s.id !== MY_STARTUP_ID);
                const randomStartup = competitors[Math.floor(Math.random() * competitors.length)];
                
                // They outbid the current #1
                const currentTopBid = [...DB.startups].sort((a, b) => b.bid - a.bid)[0].bid;
                randomStartup.bid = currentTopBid + 200;
                
                showToast(`Live Bid: ${randomStartup.name} just bid ₹${randomStartup.bid.toLocaleString()}`, "live");
                renderLeaderboard(randomStartup.id);
            }
        }, 12000);

    </script>
</body>
</html>
